                Title: Key Technologies of Field Robots for Urban Disaster Rescue
            </p>
        <p class="text-justify" style="font-size: 15pt;">
           <strong>Abstract:</strong>Urban disasters cause huge threats and damage to people's lives and properties. Autonomous mobile robots with rescue equipment can be the most effective means to solve urgent rescue needs and ensure people's lives and safety. However, the autonomous capability of mobile robots is still challenging due to a series of complex factors, e.g., changing illumination, moving objects, rough terrain, and information instability. Stable state estimation, fast path planning, and accurate motion control are three of the most important key technologies to realize the autonomous operation of rescue robots. This talk will focus on the mentioned three technologies and introduce nROS-Lab's recent results on the ground and aerial rescue robots. The state estimation algorithm based on cross-modality sensors will be presented, and the robust perception with active strategy in the complex illumination environments will also be introduced. In addition, the motion planning for active and robust environmental perception will be presented. Finally, a to-be-open-sourced physical engine simulation system for efficiently verifying the algorithms of rescue robots will be introduced.
        </p>
